[package]
name = "irodori-studio"
version = "0.1.0"
description = "Unofficial cross-platform desktop app for the Japanese TTS model Irodori-TTS."
edition = "2021"
publish = false

[lib]
# Differs from the binary name to avoid an output-filename (PDB) collision on Windows.
name = "irodori_studio_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Kill-on-close job objects (sidecar teardown, golden rule 4), free-space queries and
# directory junctions (moving the data root).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Process groups and statvfs on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
